<!doctype html>

<html lang="en">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>zeneb</title>

<meta name="description" content="Zeneb — an ongoing archive of moving stills.">

<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">

<meta name="theme-color" content="#ffffff">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext x='16' y='24' font-size='22' font-family='Georgia,serif' font-weight='600' text-anchor='middle' fill='%23FF1493'%3EZ%3C/text%3E%3C/svg%3E">

<link rel="preload" as="font" type="font/woff2" href="./assets/fonts/SFProDisplay-Regular.woff2" crossorigin>

<link rel="preload" as="font" type="font/woff2" href="./assets/fonts/VCR.woff2" crossorigin

      media="(pointer: fine)">

<link rel="stylesheet" href="./css/style.css">

<script type="importmap">

{ "imports": { "three": "./js/vendor/three.module.js" } }

</script>

</head>

<body data-stage="mark">



  <!-- ── stage 1 · the mark ───────────────────────────────────────────── -->

  <div class="mark" id="mark" aria-hidden="true">

    <video class="mark__v" id="markVideo" src="./assets/video/mark.mp4"

           poster="./assets/video/mark-still.webp"

           autoplay muted playsinline webkit-playsinline

           preload="auto" disablepictureinpicture></video>

  </div>



  <!-- ── stage 2/3 · webgl (ipod, then camera) ────────────────────────── -->

  <canvas class="gl" id="gl" aria-hidden="true"></canvas>



  <!-- ── the lens vignette · rides the whole intro, lifts as the page lands ─ -->

  <div class="vig" id="vig" aria-hidden="true"></div>



  <!-- ── stage 4 · the canvas of work ─────────────────────────────────── -->

  <main class="work" id="work" hidden>

    <canvas class="work__cv" id="cv"></canvas>

    <p class="work__hint" id="hint">drag to explore</p>

  </main>



  <!-- ── pages ────────────────────────────────────────────────────────── -->

  <section class="page" id="pageAbout" hidden>

    <div class="page__in">

      <h1 class="page__t">zeneb</h1>

      <p class="page__p" id="aboutBody">An ongoing archive of moving stills — candid, unposed, real. Soft light and loud presence. The kind of frames that already feel like memory the moment they land.</p>

      <p class="page__p page__meta">Subject · Zeneb<br>Format · film grid<br>Status · ongoing</p>

      <button class="page__back" type="button" data-back>back</button>

    </div>

  </section>



  <section class="page" id="pageContact" hidden>
    <div class="page__in">
      <h1 class="page__t">links</h1>
      <a class="page__cta" href="https://www.instagram.com/zenebbb_/" target="_blank" rel="noopener noreferrer">instagram</a>
      <a class="page__cta" href="https://open.spotify.com/user/31ppqxrexrcg3nwcfbir4dav74xa" target="_blank" rel="noopener noreferrer">spotify</a>
      <button class="page__back" type="button" data-back>back</button>
    </div>
  </section>



  <!-- ── skip / accessibility fallback ────────────────────────────────── -->

  <button class="skip" id="skip" type="button">skip intro</button>



  <div class="music" id="music" hidden>
    <p class="music__now" id="musicNow" aria-live="polite"></p>
    <button class="music__next" id="musicNext" type="button">next</button>
  </div>



  <audio id="theme" preload="auto"></audio>



  <script type="module" src="./js/main.js"></script>

</body>

</html>
